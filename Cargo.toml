[package]
name = "hyperliquid_rust_sdk"
version = "0.5.0"
edition = "2021"
license = "MIT"
description = "Rust SDK for Hyperliquid"
homepage = "https://hyperliquid.xyz/"
readme = "README.md"
documentation = "https://github.com/hyperliquid-dex/hyperliquid-rust-sdk"
repository = "https://github.com/hyperliquid-dex/hyperliquid-rust-sdk"
targets = ["wasm32-unknown-unknown"]

[lib]
crate-type = ["cdylib", "rlib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = { version = "0.4.39", default-features = false, features = ["wasmbind", "now"] }
env_logger = { version = "0.10.0", default-features = false}
ethers = { version = "2.0.14", features = ["eip712"]}
futures-util = { version = "0.3.28", default-features = false }
hex = { version = "0.4.3", default-features = false}
http = { version = "0.2.9", default-features = false }
lazy_static = { version = "1.3", default-features = false }
log = { version = "0.4.19", default-features = false}
rand = { version = "0.8.5", default-features = false}
reqwest = { version = "0.12.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.145", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.114", default-features = false }
rmp-serde = { version = "1.0.0", default-features = false}
thiserror = { version = "2.0.11", default-features = false }
uuid =  { version = "1.6.1", default-features = false,features = ["v4"]}
getrandom = { version = "*", features = ["js"] }


# for native builds
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.43.0", features = ["full"] }
tokio-tungstenite = {version = "0.26.1", features = ["native-tls"]}


# form wasm builds
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.43.0", default-features = false, features = ["rt", "sync", "time"] }
tokio-tungstenite = { version = "0.26.1", default-features = false, features = ["rustls"] }


[features]
default = ["std"]
std = [
    "chrono/std",
    "futures-util/std",
    "getrandom/js",
    "hex/std",
    "log/std",
    "serde_json/std",
    "serde/std",
    "thiserror/std",
]
